/* EDGE V3 - postgame answer book */
.end-best-intro{margin:36px 0 15px;border-top:3px solid var(--ink);padding-top:23px}
.end-best-intro h3{font:950 clamp(25px,4vw,39px)/1.08 var(--display);letter-spacing:-1px;margin:10px 0}
.end-best-intro h3 em{font-style:normal;color:var(--blue)}
.end-best-intro p{font-size:13px;color:var(--muted)}
.ab-list{display:grid;gap:9px;margin:18px 0 24px}
.answer-board{border:2px solid var(--ink);background:#fffdf8;box-shadow:3px 3px var(--ink);overflow:hidden}
.answer-board>summary{display:flex;gap:11px;align-items:center;padding:12px 11px;list-style:none;cursor:pointer}
.answer-board>summary::-webkit-details-marker{display:none}
.answer-board[open]>summary{background:var(--lemon);border-bottom:2px solid var(--ink)}
.ab-index{font:900 19px var(--mono);color:var(--blue)}
.ab-middle{display:grid;gap:2px;flex:1;min-width:0}
.ab-middle strong{font:900 12px var(--body);letter-spacing:1px}
.ab-middle small{font:500 11px var(--body);color:#5e5868}
.ab-toggle{font:900 9px var(--mono);white-space:nowrap}
.ab-body{padding:13px}
.ab-question{font-weight:800;margin:0 0 10px;font-size:14px}
.ab-caution{font:700 10px/1.5 var(--mono);background:#eee7ff;border-left:4px solid var(--blue);padding:9px;margin-bottom:12px}
.ab-scroll{overflow-x:auto}
.ab-table{width:100%;border-collapse:collapse;min-width:325px}
.ab-table th{text-align:left;font:800 10px var(--mono);color:#6f6873;background:#f1ece4;padding:7px}
.ab-table td{border-bottom:1px solid #e9e1d7;padding:10px 7px;font-size:12px}
.ab-table .rank{font-family:var(--mono);color:#79717e}
.ab-table .who{font-weight:800}
.ab-table .value{font-variant-numeric:tabular-nums;white-space:nowrap}
.pointpill{display:inline-block;padding:3px 5px;background:#e9e1fc;color:#312173;font:900 11px var(--mono)}
.pointpill.perfect{background:var(--lemon);color:var(--ink)}
.ab-more{margin-top:12px}
.ab-more>summary{font:900 11px var(--mono);cursor:pointer;padding:12px;background:#f1edf6;list-style:none}

<script>
(function(root){
'use strict';
// Ideas stay on this device until a backend/submission endpoint is added.
const KEY='closeish-question-suggestions-v1',DRAFT='closeish-question-draft-v1';
const fields=['question','direction'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function read(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}}
let draft=read(DRAFT,{});
if(!draft||typeof draft!=='object'||Array.isArray(draft))draft={};
let saved=read(KEY,[]);
if(!Array.isArray(saved))saved=[];
let lastSaved=null;
function valid(d){
 const errors={};
 const q=String(d.question||'').trim();
 if(q.length<8)errors.question='Write a question idea (at least 8 characters).';
 else if(q.length>350)errors.question='Keep the idea within 350 characters.';
 if(!['below','above'].includes(d.direction))errors.direction='Choose a direction.';
 return errors;
}
function suggestionHTML(){
 return `<div class="suggest-simple">
 <div class="suggest-simple-intro"><span class="micro">YOUR IDEA, OUR NEXT CHALLENGE?</span><h3>GOT A GOOD ONE?</h3><p>Write your question idea. Choose the side players should approach from. The final question, limit and scoring will be researched and refined later.</p></div>
 <form id="suggestionForm" novalidate>
 <label class="suggest-field" for="suggestQuestion">YOUR QUESTION <span class="required-note">REQUIRED</span></label>
 <textarea id="suggestQuestion" name="question" rows="3" maxlength="350" required placeholder="e.g. Name a film that's under 2 hours long…" aria-describedby="error-question">${esc(draft.question||'')}</textarea>
 <span class="field-error" id="error-question"></span>
 <fieldset class="direction-picker suggest-direction" aria-describedby="error-direction"><legend>APPROACH FROM… <span class="required-note">REQUIRED</span></legend><div>
 ${[['below','↑','FROM BELOW','At or below the limit'],['above','↓','FROM ABOVE','At or above the limit']].map(([v,a,t,desc])=>`<label class="direction-option"><input type="radio" name="direction" value="${v}" ${draft.direction===v?'checked':''} required><span><b class="direction-symbol">${a}</b><strong>${t}</strong><small>${desc}</small></span></label>`).join('')}
 </div><span class="field-error" id="error-direction"></span></fieldset>
 <div class="suggest-bottom-simple"><div class="suggest-local"><b>LOCAL DEMO</b><span>Saved only in this browser, not submitted online.</span></div><button type="submit" class="cta">SAVE IDEA ↗</button></div>
 <p id="draftStatus" class="draft-status" role="status">Your draft is saved on this device as you type.</p>
 <div id="suggestionStatus" role="status" class="suggestion-status" tabindex="-1"></div>
 <div class="suggest-export"><span id="suggestionCount">${saved.length} SAVED IDEA${saved.length===1?'':'S'}</span><button type="button" class="cta ghost" id="exportSuggestions" ${saved.length?'':'disabled'}>DOWNLOAD IDEAS ↓</button></div>
 </form></div>`;
}
function collect(form){const data=new FormData(form);return Object.fromEntries(fields.map(n=>[n,String(data.get(n)||'')]))}
function writeDraft(){try{localStorage.setItem(DRAFT,JSON.stringify(draft));return true}catch{return false}}
function bindSuggestion(){
 const form=document.getElementById('suggestionForm');if(!form)return;
 const status=document.getElementById('suggestionStatus');
 function update(){status.textContent='';status.classList.remove('is-saved');draft=collect(form);const ok=writeDraft();document.getElementById('draftStatus').textContent=ok?'Draft saved on this device.':'Browser storage is unavailable. Download your idea after saving.';}
 form.addEventListener('input',update);form.addEventListener('change',update);
 form.addEventListener('submit',e=>{
  e.preventDefault();update();const errors=valid(draft);
  form.querySelectorAll('.field-error').forEach(n=>n.textContent='');form.querySelectorAll('[aria-invalid]').forEach(n=>n.removeAttribute('aria-invalid'));
  for(const [name,message]of Object.entries(errors)){document.getElementById(`error-${name}`).textContent=message;form.querySelector(`[name="${name}"]`)?.setAttribute('aria-invalid','true')}

  const fingerprint=JSON.stringify(values);
  if(lastSaved===fingerprint){status.textContent='Already saved. Edit your idea to save another.';status.focus();return}
  const item={id:root.crypto?.randomUUID?.()||`suggestion-${Date.now()}-${saved.length}`,created_at:new Date().toISOString(),status:'local_only',question:values.question,direction:values.direction};
  saved.push(item);lastSaved=fingerprint;let persisted=true;

  document.getElementById('exportSuggestions').disabled=false;
  status.textContent=persisted?'Saved on this device. Not sent to the team — download the JSON to share it.':'Storage unavailable. Idea saved in memory only — download before closing.';

 });

  const blob=new Blob([JSON.stringify({format:'closeish-question-suggestions-v2',exported_at:new Date().toISOString(),suggestions:saved},null,2)],{type:'application/json'});

 });

function guideHTML(){return `<section class="guide-single" aria-labelledby="guideSingleTitle">

 const more=document.querySelector(`[data-load-more="${i}"]`);if(more){more.hidden=entries.length===matches.length;more.textContent=`SHOW NEXT ${formatNum(Math.min(240,matches.length-entries.length))} / ${formatNum(matches.length-entries.length)} REMAINING ↘`}
 const empty=document.querySelector(`[data-empty="${i}"]`);if(empty)empty.hidden=entries.length!==0;
}
const bookFilters={};
function demoStatsHTML(){
 const d=globalThis.CLOSEISHChart.distribution(scoreSoFar());
 const chart=globalThis.CLOSEISHChart;
 return `<section class="mock-stat-card" aria-label="Illustrative daily score distribution"><div class="mock-stat-top"><div><span class="micro">CHALLENGE #${String(dayNum).padStart(3,'0')} / SCORE DISTRIBUTION</span><h3>HOW DID YOU STACK UP?</h3></div></div><div class="chart-scorecards"><div class="chart-your"><span>YOUR SCORE</span><strong>${formatScore(d.score)}<small> / 7200</small></strong></div><div class="chart-average"><span>SAMPLE AVERAGE</span><strong>${formatNum(Math.round(d.mean))}<small> pts</small></strong></div><div class="chart-percentile"><span>SCORED HIGHER THAN</span><strong>${d.percentile.toFixed(1)}<small>%</small></strong><small>of this fictional sample</small></div></div><div class="chart-canvas">${chart.svg(d)}${chart.svg(d,true)}</div><div class="chart-legend"><span><i class="legend-profile"></i>Smoothed distribution</span><span><i class="legend-average"></i>Sample average</span><span><i class="legend-you"></i>Your score</span></div><p class="chart-note">Illustrative relative distribution.</p><div class="chart-quartiles" aria-label="Fictional sample score quartiles"><div><span>LOWER QUARTILE</span><strong>${formatNum(d.q25)}</strong><small>25th percentile</small></div><div><span>MEDIAN SCORE</span><strong>${formatNum(d.median)}</strong><small>50th percentile</small></div><div><span>UPPER QUARTILE</span><strong>${formatNum(d.q75)}</strong><small>75th percentile</small></div></div></section>`;
}
function answerCataloguePanelHTML(){
 if(answerBookOpen===null){
  return `<section class="run-answers"${catalogueLockedHeight===null?'':` style="height:${catalogueLockedHeight}px"`}><span class="micro">ROUND BY ROUND</span><h3>ANSWER<br>CATALOGUE</h3><p>Choose a question to search names and compare points.</p><div class="ab-list">${questions().map((q,i)=>`<button class="book-launch" data-open-book="${i}"><span>Q${i+1}</span><strong>${escapeHTML(displayPrompt(q))}<small>${escapeHTML(CATEGORIES[q.topic])}</small></strong><b aria-hidden="true">↗</b></button>`).join('')}</div></section>`;
 }
 const q=questions()[answerBookOpen];
 if(!q){answerBookOpen=null;return answerCataloguePanelHTML()}
 const result=curProgress().responses[answerBookOpen];
 return `<section class="run-answers run-answers-open"${catalogueLockedHeight===null?'':` style="height:${catalogueLockedHeight}px"`}><div class="catalogue-toolbar"><button class="book-back" id="bookBack" aria-label="Back to question list">← BACK</button><span class="micro">QUESTION CATALOGUE</span></div><div class="catalogue-result-head"><h3>Q${answerBookOpen+1}</h3><div class="catalogue-my-result" aria-label="Your answer and points for question ${answerBookOpen+1}"><div class="catalogue-my-answer"><small>YOUR ANSWER</small><span>${escapeHTML(answerName(result))}</span></div><strong class="catalogue-my-points">${formatScore(result?.points??0)} <small>PTS</small></strong></div></div><p class="catalogue-question">${escapeHTML(displayPrompt(q))}</p><div class="catalogue-inline">${leaderboardHTML(q,answerBookOpen).replace(/<summary>[\s\S]*?<\/summary>/,'').replace('<details class="answer-board"','<div class="answer-board answer-board-inline"').replace('</details>','</div>')}</div></section>`;
}
// Swap only the answer catalogue, never re-render the whole results screen.
// Freeze its measured height before changing contents so all three columns stay aligned.
function swapCatalogue(nextRound){
 const previous=document.querySelector('.end-screen .run-answers');
 if(!previous)return;
 if(catalogueLockedHeight===null)catalogueLockedHeight=previous.getBoundingClientRect().height;
 answerBookOpen=nextRound;
 const holder=document.createElement('div');holder.innerHTML=answerCataloguePanelHTML();
 const replacement=holder.firstElementChild;
 previous.replaceWith(replacement);
 bindCataloguePanel();
 if(answerBookOpen!==null){populateBook(answerBookOpen);replacement.querySelector('#bookBack')?.focus({preventScroll:true})}
 else replacement.querySelector(`[data-open-book="${nextRound??0}"]`)?.focus({preventScroll:true});
}
function bindCataloguePanel(){
 const panel=document.querySelector('.end-screen .run-answers');
 if(!panel)return;
 panel.querySelectorAll('[data-open-book]').forEach(b=>b.addEventListener('click',()=>swapCatalogue(Number(b.dataset.openBook))));
 panel.querySelector('#bookBack')?.addEventListener('click',()=>swapCatalogue(null));
 panel.querySelectorAll('.answer-board').forEach(d=>d.addEventListener('toggle',()=>{if(d.open&&answerBookOpen!==null)populateBook(answerBookOpen)}));
 panel.querySelectorAll('[data-search]').forEach(x=>x.addEventListener('input',()=>{catalogueLimits[+x.dataset.search]=240;populateBook(+x.dataset.search)}));
 panel.querySelectorAll('[data-load-more]').forEach(b=>b.addEventListener('click',()=>{let i=+b.dataset.loadMore;catalogueLimits[i]=(catalogueLimits[i]||240)+240;populateBook(i)}));
 panel.querySelectorAll('[data-filter]').forEach(x=>x.addEventListener('click',()=>{
  const [idx,tier]=x.dataset.filter.split(':');bookFilters[+idx]=tier;
  panel.querySelectorAll(`[data-filter^="${idx}:"]`).forEach(b=>b.classList.toggle('active',b===x));
  catalogueLimits[+idx]=240;populateBook(+idx);
 }));
 if(answerBookOpen!==null)populateBook(answerBookOpen);
}
// Prefer the player's literal submitted text; fall back to the resolved name.
// A skipped or timed-out blank entry has no answer.
function answerName(r){return r?.raw?.trim()||r?.canonical||'No answer'}
// Keep zero-point outcomes distinct: skipping and an unverified answer are not the same.
function summaryTier(r){
 if(!r)return 'NO SCORE';
 if(r.kind==='scored'&&Core.TIERS[r.points])return Core.TIERS[r.points];
 const zeroLabels={far:'TOO FAR',over:'CROSSED LIMIT',skipped:'SKIPPED',timeout:'TIME OUT',review:'NEEDS REVIEW',invalid:'INELIGIBLE',unverified:'NO VERIFIED DATA'};
 return zeroLabels[r.kind]||'NO SCORE';
}
function endHTML(){const results=curProgress().responses;return `<div class="end-screen"><div class="end-dashboard"><section class="run-summary"><div class="ribbon">✹ THE RUN IS DONE</div><h2>THAT WAS CLOSEISH.</h2><div class="end-score">${formatScore(scoreSoFar())}<small> / ${formatScore(MAX)}</small></div><div class="end-rows" aria-label="Point category, your answer, and earned points for each question">${questions().map((q,i)=>{const r=results[i];return `<div class="end-row"><span class="index">Q${i+1}</span><div class="end-row-detail"><strong class="tier">${escapeHTML(summaryTier(r))}</strong><div class="end-row-meta"><span class="end-row-answer">${escapeHTML(answerName(r))}</span><span class="end-row-points">${formatScore(r?.points??0)} pts</span></div></div></div>`}).join('')}</div><div class="btnrow"><button class="cta" id="shareBtn">COPY RESULTS ↗</button><button class="cta ghost" data-modal="archive">ARCHIVE</button><button class="cta ghost" id="replayBtn" title="Replay this day from round 1, replacing its saved score">REPLAY DAY ↻</button></div></section>${demoStatsHTML()}${answerCataloguePanelHTML()}</div></div>`}

function calendarHTML(){
 const origin=new Date(Date.UTC(2026,9,1));
 const first=new Date(Date.UTC(origin.getUTCFullYear(),origin.getUTCMonth()+archiveMonthIndex,1));
 const year=first.getUTCFullYear(),month=first.getUTCMonth();
 const name=first.toLocaleDateString('en-US',{month:'long',year:'numeric',timeZone:'UTC'}).toUpperCase();
 const offset=(first.getUTCDay()+6)%7; // Week begins Monday.
 const count=new Date(Date.UTC(year,month+1,0)).getUTCDate();
 const cells=Array.from({length:offset},()=>'<span class="cal-empty" aria-hidden="true"></span>');
 for(let date=1;date<=count;date++){
  const iso=`${year}-${String(month+1).padStart(2,'0')}-${String(date).padStart(2,'0')}`;
  const n=Core.dayNumber(iso);
  if(n<1||n>7){cells.push(`<span class="cal-out-of-range" aria-label="${iso}: outside the challenge season">${date}</span>`);continue}
  const published=Boolean(DATA[String(n)])&&canPlayDay(n);
  const completed=published&&Boolean(allProgress[Core.progressKey(DATA,n)]?.completed);
  const selected=published&&n===dayNum;
  const klass=['cal-day',published?'cal-available':'cal-upcoming',selected?'cal-selected':'',completed?'cal-completed':''].filter(Boolean).join(' ');
  const description=`${iso} · challenge ${String(n).padStart(3,'0')}`+(published?(completed?' completed':' available'):' not loaded');
  cells.push(`<button type="button" class="${klass}" ${published?`data-day="${n}"`:'disabled'} aria-label="${description}" ${selected?'aria-current="date"':''}><span class="cal-date">${date}</span><small>${published?`#${String(n).padStart(3,'0')}`:'—'}</small>${completed?'<span class="cal-check">✓</span>':''}</button>`);
 }
 return `<div class="closeish-calendar"><div class="cal-top"><button type="button" class="cal-nav" data-cal-step="-1" aria-label="Previous month" disabled>‹</button><div class="cal-heading">${name}<small>2026 OCT 20–26</small></div><button type="button" class="cal-nav" data-cal-step="1" aria-label="Next month" disabled>›</button></div><div class="cal-weekdays">${['MON','TUE','WED','THU','FRI','SAT','SUN'].map(n=>`<span>${n}</span>`).join('')}</div><div class="cal-grid">${cells.join('')}</div><div class="cal-legend"><span><i class="cal-indicator available"></i> PLAYABLE</span><span><i class="cal-indicator done"></i> COMPLETED</span><span><i class="cal-indicator locked"></i> NOT LOADED</span></div></div>`;
}
let bookRound=0;
let answerBookOpen=null;
let catalogueLockedHeight=null;
let modalTrigger='[data-modal="rules"]';
function closeOverlay(){showModal=null;render();document.querySelector(modalTrigger)?.focus()}
function modalHTML(){
 if(!showModal)return '';
 const community=globalThis.CLOSEISHCommunity;
 const content=showModal==='rules'?community.guideHTML():showModal==='suggest'?community.suggestionHTML():showModal==='archive'?calendarHTML():showModal==='stats'?demoStatsHTML().match(/<details class="chart-data">[\s\S]*?<\/details>/)[0].replace('<details','<details open'):'<h3>THE DAILY GAME OF LIMITS.</h3><p>Six questions. One edge.</p>';
 const title=showModal==='rules'?'HOW TO PLAY':showModal==='suggest'?'SUGGEST A QUESTION':showModal==='archive'?'THE ARCHIVE':showModal==='stats'?'DEMO NUMBERS':'ABOUT CLOSEISH';
 return `<div class="modalwrap" id="modalWrap"><div class="modal modal-${showModal}" role="dialog" aria-modal="true" aria-labelledby="overlayTitle"><div class="modalhead"><strong id="overlayTitle">${title}</strong><button id="closeModal" class="closebtn" aria-label="Close">×</button></div>${phase==='play'?'<div class="modal-timer-note" role="note">Your round timer keeps running while this is open.</div>':''}<div class="modalcontent">${content}</div></div></div>`;
}
document.addEventListener('keydown',event=>{
 if(!showModal)return;
 if(event.key==='Escape'){event.preventDefault();closeOverlay();return}
 if(event.key!=='Tab')return;
 const nodes=[...document.querySelectorAll('.modal button:not(:disabled),.modal input:not(:disabled),.modal textarea,.modal select,.modal a[href],.modal [tabindex="0"]')].filter(n=>!n.hidden);
 const first=nodes[0],last=nodes[nodes.length-1];
 if(event.shiftKey&&(document.activeElement===first||!nodes.includes(document.activeElement))){event.preventDefault();last?.focus()}
 else if(!event.shiftKey&&(document.activeElement===last||!nodes.includes(document.activeElement))){event.preventDefault();first?.focus()}
});

function unavailableHTML(){return `<div class="start-screen"><div class="start-kicker">DAILY CHALLENGE</div><h2>NOT AVAILABLE<br>YET.</h2><p>This date has no published question set in this checkpoint. Choose an available day from the archive.</p><button class="cta big" data-modal="archive">OPEN ARCHIVE ↗</button></div>`}
function render(){document.body.classList.toggle('edge-ended',phase==='end');document.body.classList.toggle('edge-playing',phase==='play');document.body.classList.toggle('edge-run',phase!=='intro');document.body.classList.toggle('edge-intro',phase==='intro');const p=curProgress();if(phase==='intro'&&p.completed)phase='end';const inner=!dayPack()?unavailableHTML():phase==='intro'?introHTML():phase==='play'?arenaHTML():phase==='reveal'?revealHTML():endHTML();el.innerHTML=`<header class="topbar"><div class="top-inner"><button class="logo" id="homeBtn" type="button" aria-label="${phase==='play'||phase==='reveal'?'Home navigation unavailable during the challenge':'CLOSEISH home'}" ${phase==='play'||phase==='reveal'?'disabled title="Finish all six rounds to return home"':''}>CLOSE<span class="period">ISH</span><svg viewBox="0 0 28 28" aria-hidden="true"><path fill="#ff6a55" stroke="#19151f" stroke-width="2" d="M14 1L18 9 27 7 22 15 27 23 17 21 13 28 10 19 1 20 6 13 2 5 11 9Z"/></svg></button><nav class="mainnav" aria-label="Main navigation">${unitControlHTML()}<button class="navbutton navsuggest" data-modal="suggest">SUGGEST +</button><button class="navbutton" data-modal="rules">HOW TO PLAY</button><button class="navbutton navarchive" data-modal="archive">ARCHIVE ↗</button></nav></div></header><div class="ticker"><span>${('✳ KNOW IT. RISK IT. NAIL IT. &nbsp;&nbsp;&nbsp; ✳ ANY TOPIC. ONE LIMIT. &nbsp;&nbsp;&nbsp; ✳ NO GUESSING FROM A LIST. &nbsp;&nbsp;&nbsp; ').repeat(9)}</span></div><section class="hero"><div class="hero-inner"><div class="hero-copy"><div class="eyebrow"><i class="line"></i> THE DAILY GAME OF LIMITS</div><h1>CLOSE<span>ISH</span></h1><p class="hero-sub">Know something weird? <em>Put it on the line.</em></p></div><div class="hero-art" aria-hidden="true"><div class="art-panel"><div class="art-limit"></div><div class="art-label">THE LIMIT</div><svg class="art-line" viewBox="0 0 250 160"><polyline points="5,138 42,118 81,127 116,85 151,98 183,43 211,64 240,12"/><circle cx="240" cy="12" r="11"/></svg></div><div class="art-sticker">CLOSE<br>CALL!</div></div></div></section><div class="breakline">★ <b>THINK HARD</b> ★ <b>GO BIG</b> ★ <b>CHECK THE DIRECTION</b> ★ <b>COME BACK TOMORROW</b> ★</div><main class="shell content"><div class="section-head"><div><div class="micro">THE DAILY CHALLENGE</div></div><div class="day-badge">${dayPack()?'CHALLENGE #'+String(dayNum).padStart(3,'0'):new Date().toISOString().slice(0,10)}</div></div><div class="playgrid"> <section class="card maincard" id="gameArea">${inner}</section></div></main><footer class="shell footer"><strong>CLOSEISH / KNOW YOUR LIMITS.</strong><span>Wildly specific limits. Free-text answers. No ads.</span></footer>${modalHTML()}`;
 bindUnitControl();
 document.getElementById('homeBtn')?.addEventListener('click',()=>{if(phase==='play'||phase==='reveal')return;stopClock();answerBookOpen=null;catalogueLockedHeight=null;phase=curProgress().completed?'end':'intro';render()});document.querySelectorAll('[data-modal]').forEach(b=>b.addEventListener('click',()=>{modalTrigger=`[data-modal="${b.dataset.modal}"]`;showModal=b.dataset.modal;if(showModal==='rules')globalThis.CLOSEISHCommunity.resetGuide();if(showModal==='archive')archiveMonthIndex=0;render()}));document.getElementById('closeModal')?.addEventListener('click',closeOverlay);document.getElementById('modalWrap')?.addEventListener('mousedown',e=>{if(e.target.id==='modalWrap')closeOverlay()});document.querySelectorAll('[data-cal-step]').forEach(b=>b.addEventListener('click',()=>{archiveMonthIndex=0;render()}));document.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>{showModal=null;showDay(+b.dataset.day)}));
 document.getElementById('startBtn')?.addEventListener('click',()=>{let saved=curProgress();if(Number.isInteger(saved.activeRound)&&saved.activeDeadline){round=saved.activeRound;deadline=saved.activeDeadline;restoreDraft(saved);phase='play';render();if(timerRemaining()<=0)timeoutRound();else startClock();return}round=saved.responses.findIndex(x=>!x);if(round<0)round=saved.responses.length||0;playRound()});document.getElementById('answerForm')?.addEventListener('submit',e=>{e.preventDefault();submitAnswer()});
 const field=document.getElementById('guess');if(field){field.addEventListener('input',updateHints);if(inputValue){activeHints=candidateMatches(currentQ(),inputValue);refreshInlineHint()}}
 document.getElementById('replayBtn')?.addEventListener('click',replayDay);document.getElementById('skipBtn')?.addEventListener('click',skipRound);document.getElementById('nextBtn')?.addEventListener('click',nextRound);document.getElementById('reviewBtn')?.addEventListener('click',submitReview);document.getElementById('shareBtn')?.addEventListener('click',share);
 bindCataloguePanel();
 document.querySelector('.end-screen .chart-data summary')?.addEventListener('click',e=>{e.preventDefault();modalTrigger='.end-screen .chart-data summary';showModal='stats';render()});
 document.body.classList.toggle('overlay-open',Boolean(showModal));
 [...el.children].forEach(child=>{if(child.id!=='modalWrap')child.inert=Boolean(showModal)});
 if(showModal==='suggest')globalThis.CLOSEISHCommunity.bindSuggestion();
 if(showModal==='rules')globalThis.CLOSEISHCommunity.bindGuide(render,closeOverlay);
 if(showModal)document.getElementById('closeModal')?.focus();
}
async function share(){const p=curProgress(),score=scoreSoFar();const grid=p.responses.map(r=>r.points===1200?'🟪':r.points===1000?'🟩':r.points>=600?'🟦':r.points>=200?'🟨':'⬛').join('');let text=`CLOSEISH #${String(dayNum).padStart(3,'0')} — ${score}/${MAX}\n${grid}\nSix rounds. One edge.`;try{await navigator.clipboard.writeText(text);let b=document.getElementById('shareBtn');if(b)b.textContent='COPIED ✓'}catch{prompt('Copy your results:',text)}}
function restore(){if(!dayPack()){phase='intro';render();return}let saved=curProgress();if(saved.completed){phase='end';render();return}if(Number.isInteger(saved.activeRound)&&saved.activeDeadline){round=saved.activeRound;deadline=saved.activeDeadline;restoreDraft(saved);phase='play';render();if(timerRemaining()<=0){timeoutRound()}else startClock();return}phase='intro';render()}
loadCityCache();
restore();
if(dayNum===2)setTimeout(autoStartDayTwoRegistries,400);
})();
</script></body></html>
